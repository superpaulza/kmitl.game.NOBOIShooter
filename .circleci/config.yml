version: 2.1

# =============================================================================
# CircleCI Multi-Platform Build Pipeline for NOBOIShooter (MonoGame)
# =============================================================================
# Builds: Windows, Linux, macOS (x64 + arm64), Android, iOS
# Artifacts: Available in CircleCI Artifacts tab after build
#
# Key design:
#   - Each job only restores/publishes the specific project it needs (not the
#     entire solution) to avoid cross-platform workload errors.
#   - macOS executor installs .NET SDK via brew before any dotnet commands.
#   - Workloads are installed BEFORE dotnet restore/publish.
#   - dotnet-mgcb tool is restored via .config/dotnet-tools.json manifest.
#   - dotnet publish handles restore + build + MGCB content in one step.
# =============================================================================

# ---------------------------------------------------------------------------
# Executors
# ---------------------------------------------------------------------------
executors:
  dotnet:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:8.0
    working_directory: ~/repo
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1

  macos:
    macos:
      xcode: "15.4"
    resource_class: macos.m1.medium.gen1
    working_directory: ~/repo
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1

# ---------------------------------------------------------------------------
# Reusable commands
# ---------------------------------------------------------------------------
commands:
  checkout_and_restore:
    steps:
      - checkout
      - restore_cache:
          keys:
            - dotnet-v4-{{ checksum "NOBOIShooter.Shared/NOBOIShooter.Shared.csproj" }}
            - dotnet-v4-

  save_dotnet_cache:
    steps:
      - save_cache:
          key: dotnet-v4-{{ checksum "NOBOIShooter.Shared/NOBOIShooter.Shared.csproj" }}
          paths:
            - ~/.nuget/packages
            - ~/.dotnet

  restore_mgcb_tool:
    description: "Restore dotnet-mgcb tool from .config/dotnet-tools.json"
    steps:
      - run:
          name: Restore MGCB content builder tool
          command: dotnet tool restore

  install_dotnet_sdk:
    description: "Install .NET SDK on macOS (not present by default)"
    steps:
      - run:
          name: Install .NET SDK
          command: |
            if ! command -v dotnet &> /dev/null; then
              brew install dotnet
              echo 'export PATH="/opt/homebrew/opt/dotnet/bin:$PATH"' >> "$BASH_ENV"
              echo 'export PATH="/usr/local/share/dotnet:$PATH"' >> "$BASH_ENV"
            fi

  install_android_sdk:
    description: "Install Android SDK command-line tools and platforms"
    steps:
      - run:
          name: Install Android SDK
          command: |
            if [ ! -d "$ANDROID_HOME" ]; then
              export ANDROID_HOME=/opt/android-sdk
              echo "export ANDROID_HOME=/opt/android-sdk" >> "$BASH_ENV"
              mkdir -p $ANDROID_HOME
              cd /tmp
              curl -sO https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
              unzip -q commandlinetools-linux-11076708_latest.zip
              mkdir -p $ANDROID_HOME/cmdline-tools
              mv cmdline-tools $ANDROID_HOME/cmdline-tools/latest
              yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1
              $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
            fi

# ---------------------------------------------------------------------------
# Jobs
# ---------------------------------------------------------------------------
jobs:
  # =========================================================================
  # Windows build (cross-compiled from Linux Docker)
  # =========================================================================
  build-windows:
    executor: dotnet
    steps:
      - checkout_and_restore
      - restore_mgcb_tool
      - run:
          name: Publish Windows x64
          command: |
            dotnet publish NOBOIShooter.DesktopGL/NOBOIShooter.DesktopGL.csproj \
              -r win-x64 \
              --self-contained \
              -c Release \
              -o artifacts/win-x64
      - run:
          name: Package Windows artifact
          command: |
            cd artifacts/win-x64
            zip -r ../NOBOIShooter-win-x64.zip .
      - save_dotnet_cache
      - store_artifacts:
          path: artifacts/NOBOIShooter-win-x64.zip
          destination: builds/NOBOIShooter-win-x64.zip

  # =========================================================================
  # Linux build
  # =========================================================================
  build-linux:
    executor: dotnet
    steps:
      - checkout_and_restore
      - restore_mgcb_tool
      - run:
          name: Publish Linux x64
          command: |
            dotnet publish NOBOIShooter.DesktopGL/NOBOIShooter.DesktopGL.csproj \
              -r linux-x64 \
              --self-contained \
              -c Release \
              -o artifacts/linux-x64
      - run:
          name: Package Linux artifact
          command: |
            cd artifacts/linux-x64
            tar -czf ../NOBOIShooter-linux-x64.tar.gz .
      - save_dotnet_cache
      - store_artifacts:
          path: artifacts/NOBOIShooter-linux-x64.tar.gz
          destination: builds/NOBOIShooter-linux-x64.tar.gz

  # =========================================================================
  # macOS Intel build
  # =========================================================================
  build-macos-x64:
    executor: macos
    steps:
      - checkout_and_restore
      - install_dotnet_sdk
      - restore_mgcb_tool
      - run:
          name: Publish macOS x64
          command: |
            dotnet publish NOBOIShooter.DesktopGL/NOBOIShooter.DesktopGL.csproj \
              -r osx-x64 \
              --self-contained \
              -c Release \
              -o artifacts/osx-x64
      - run:
          name: Package macOS x64 artifact
          command: |
            cd artifacts/osx-x64
            zip -r ../NOBOIShooter-osx-x64.zip .
      - save_dotnet_cache
      - store_artifacts:
          path: artifacts/NOBOIShooter-osx-x64.zip
          destination: builds/NOBOIShooter-osx-x64.zip

  # =========================================================================
  # macOS Apple Silicon build
  # =========================================================================
  build-macos-arm64:
    executor: macos
    steps:
      - checkout_and_restore
      - install_dotnet_sdk
      - restore_mgcb_tool
      - run:
          name: Publish macOS arm64
          command: |
            dotnet publish NOBOIShooter.DesktopGL/NOBOIShooter.DesktopGL.csproj \
              -r osx-arm64 \
              --self-contained \
              -c Release \
              -o artifacts/osx-arm64
      - run:
          name: Package macOS arm64 artifact
          command: |
            cd artifacts/osx-arm64
            zip -r ../NOBOIShooter-osx-arm64.zip .
      - save_dotnet_cache
      - store_artifacts:
          path: artifacts/NOBOIShooter-osx-arm64.zip
          destination: builds/NOBOIShooter-osx-arm64.zip

  # =========================================================================
  # Android build
  # =========================================================================
  build-android:
    executor: dotnet
    steps:
      - checkout_and_restore
      - install_android_sdk
      - run:
          name: Install Android workload
          command: dotnet workload install android
      - restore_mgcb_tool
      - run:
          name: Publish Android arm64 (unsigned APK)
          command: |
            dotnet publish NOBOIShooter.Android/NOBOIShooter.Android.csproj \
              -r android-arm64 \
              --self-contained \
              -c Release \
              -o artifacts/android-arm64
      - run:
          name: Publish Android x64 (for emulator testing)
          command: |
            dotnet publish NOBOIShooter.Android/NOBOIShooter.Android.csproj \
              -r android-x64 \
              --self-contained \
              -c Release \
              -o artifacts/android-x64
      - run:
          name: Package Android artifacts
          command: |
            cd artifacts/android-arm64
            zip -r ../NOBOIShooter-android-arm64.zip .
            cd ../android-x64
            zip -r ../NOBOIShooter-android-x64.zip .
      - save_dotnet_cache
      - store_artifacts:
          path: artifacts/NOBOIShooter-android-arm64.zip
          destination: builds/NOBOIShooter-android-arm64.zip
      - store_artifacts:
          path: artifacts/NOBOIShooter-android-x64.zip
          destination: builds/NOBOIShooter-android-x64.zip

  # =========================================================================
  # iOS build (unsigned - requires Apple Developer account for distribution)
  # =========================================================================
  build-ios:
    executor: macos
    steps:
      - checkout_and_restore
      - install_dotnet_sdk
      - run:
          name: Install iOS workload
          command: dotnet workload install maui
      - restore_mgcb_tool
      - run:
          name: Publish iOS arm64 (unsigned)
          command: |
            dotnet publish NOBOIShooter.iOS/NOBOIShooter.iOS.csproj \
              -r ios-arm64 \
              --self-contained \
              -c Release \
              -o artifacts/ios-arm64
      - run:
          name: Package iOS artifact
          command: |
            cd artifacts/ios-arm64
            zip -r ../NOBOIShooter-ios-arm64.zip .
      - save_dotnet_cache
      - store_artifacts:
          path: artifacts/NOBOIShooter-ios-arm64.zip
          destination: builds/NOBOIShooter-ios-arm64.zip

# ---------------------------------------------------------------------------
# Workflows
# ---------------------------------------------------------------------------
workflows:
  version: 2
  build-and-release:
    jobs:
      - build-windows
      - build-linux
      - build-macos-x64
      - build-macos-arm64
      - build-android
      - build-ios
