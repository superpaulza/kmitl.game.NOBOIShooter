version: 2.1

# =============================================================================
# CircleCI Multi-Platform Build Pipeline for NOBOIShooter (MonoGame)
# =============================================================================
# Builds: Windows, Linux, macOS (x64 + arm64), Android, iOS
#
# Key design:
#   - Content is built ONCE on Linux (where MGCB FFmpeg works reliably) and
#     shared via workspaces to macOS/iOS jobs which skip content building.
#   - Windows, Linux, Android build their own content on Linux Docker.
#   - macOS/iOS attach the workspace and compile code only (/p:BuildContent=false).
# =============================================================================

executors:
  dotnet:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:8.0
    working_directory: ~/repo
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1

  macos:
    macos:
      xcode: "15.4"
    resource_class: macos.m1.medium.gen1
    working_directory: ~/repo
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1

commands:
  checkout_and_restore:
    steps:
      - checkout
      - restore_cache:
          keys:
            - dotnet-v6-{{ checksum "NOBOIShooter.Shared/NOBOIShooter.Shared.csproj" }}
            - dotnet-v6-

  save_dotnet_cache:
    steps:
      - save_cache:
          key: dotnet-v6-{{ checksum "NOBOIShooter.Shared/NOBOIShooter.Shared.csproj" }}
          paths:
            - ~/.nuget/packages
            - ~/.dotnet

  restore_mgcb_tool:
    steps:
      - run:
          name: Restore MGCB content builder tool
          command: dotnet tool restore || true

  install_linux_deps:
    steps:
      - run:
          name: Install native dependencies (Linux)
          command: |
            apt-get update && apt-get install -y \
              libfreetype6 \
              libpng16-16 \
              libgl1-mesa-glx \
              libgl1-mesa-dri \
              ffmpeg \
              zip \
              || true

  install_macos_deps:
    steps:
      - run:
          name: Install .NET SDK and native dependencies (macOS)
          command: |
            # Install .NET SDK
            if ! command -v dotnet &> /dev/null; then
              curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
              chmod +x /tmp/dotnet-install.sh
              /tmp/dotnet-install.sh --channel 8.0
              echo 'export PATH="$HOME/.dotnet:$PATH"' >> "$BASH_ENV"
              export PATH="$HOME/.dotnet:$PATH"
            fi
            # Install native deps
            brew install freeimage freetype libpng ffmpeg || true
            BREW_LIB=$(brew --prefix)/lib
            # Create symlinks for FreeImage
            for name in FreeImage freeimage; do
              for ext in dylib tbd; do
                src="$BREW_LIB/lib${name}.${ext}"
                dst="$BREW_LIB/${name}.${ext}"
                if [ -f "$src" ] && [ ! -e "$dst" ]; then
                  ln -s "$src" "$dst"
                fi
              done
            done
            # Create symlinks for freetype6
            for ext in dylib tbd; do
              src="$BREW_LIB/libfreetype.${ext}"
              dst="$BREW_LIB/freetype6.${ext}"
              if [ -f "$src" ] && [ ! -e "$dst" ]; then
                ln -s "$src" "$dst"
              fi
            done

  install_android_sdk:
    steps:
      - run:
          name: Install Java and Android SDK
          command: |
            export ANDROID_HOME=/opt/android-sdk
            echo "export ANDROID_HOME=/opt/android-sdk" >> "$BASH_ENV"
            echo "export ANDROID_SDK_ROOT=/opt/android-sdk" >> "$BASH_ENV"
            apt-get update && apt-get install -y unzip curl openjdk-17-jdk-headless
            export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
            echo "export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$BASH_ENV"
            if [ ! -d "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
              mkdir -p $ANDROID_HOME
              cd /tmp
              curl -fSL -o commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
              unzip -q -o commandlinetools.zip
              mkdir -p $ANDROID_HOME/cmdline-tools
              rm -rf $ANDROID_HOME/cmdline-tools/latest
              mv cmdline-tools $ANDROID_HOME/cmdline-tools/latest
              yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
              $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
            fi
            java -version 2>&1 || true

jobs:
  # =========================================================================
  # Build content on Linux (where MGCB FFmpeg works reliably)
  # =========================================================================
  build-content:
    executor: dotnet
    steps:
      - checkout_and_restore
      - install_linux_deps
      - restore_mgcb_tool
      - run:
          name: Build MGCB content
          command: |
            dotnet build NOBOIShooter.Shared/NOBOIShooter.Shared.csproj \
              -c Release \
              /p:BuildContent=true
      - persist_to_workspace:
          root: .
          paths:
            - NOBOIShooter.Shared/Content/bin
            - NOBOIShooter.Shared/Content/obj

  # =========================================================================
  # Windows build (cross-compiled from Linux Docker)
  # =========================================================================
  build-windows:
    executor: dotnet
    steps:
      - checkout_and_restore
      - install_linux_deps
      - restore_mgcb_tool
      - attach_workspace:
          at: .
      - run:
          name: Publish Windows x64
          command: |
            dotnet publish NOBOIShooter.DesktopGL/NOBOIShooter.DesktopGL.csproj \
              -r win-x64 \
              --self-contained \
              -c Release \
              -o artifacts/win-x64
      - run:
          name: Package Windows artifact
          command: |
            cd artifacts/win-x64
            zip -r ../NOBOIShooter-win-x64.zip .
      - save_dotnet_cache
      - store_artifacts:
          path: artifacts/NOBOIShooter-win-x64.zip
          destination: builds/NOBOIShooter-win-x64.zip

  # =========================================================================
  # Linux build
  # =========================================================================
  build-linux:
    executor: dotnet
    steps:
      - checkout_and_restore
      - install_linux_deps
      - restore_mgcb_tool
      - attach_workspace:
          at: .
      - run:
          name: Publish Linux x64
          command: |
            dotnet publish NOBOIShooter.DesktopGL/NOBOIShooter.DesktopGL.csproj \
              -r linux-x64 \
              --self-contained \
              -c Release \
              -o artifacts/linux-x64
      - run:
          name: Package Linux artifact
          command: |
            cd artifacts/linux-x64
            tar -czf ../NOBOIShooter-linux-x64.tar.gz .
      - save_dotnet_cache
      - store_artifacts:
          path: artifacts/NOBOIShooter-linux-x64.tar.gz
          destination: builds/NOBOIShooter-linux-x64.tar.gz

  # =========================================================================
  # macOS Intel build
  # =========================================================================
  build-macos-x64:
    executor: macos
    steps:
      - checkout_and_restore
      - install_macos_deps
      - restore_mgcb_tool
      - attach_workspace:
          at: .
      - run:
          name: Publish macOS x64
          command: |
            dotnet publish NOBOIShooter.DesktopGL/NOBOIShooter.DesktopGL.csproj \
              -r osx-x64 \
              --self-contained \
              -c Release \
              -p:BuildContent=false \
              -o artifacts/osx-x64
      - run:
          name: Package macOS x64 artifact
          command: |
            cd artifacts/osx-x64
            zip -r ../NOBOIShooter-osx-x64.zip .
      - save_dotnet_cache
      - store_artifacts:
          path: artifacts/NOBOIShooter-osx-x64.zip
          destination: builds/NOBOIShooter-osx-x64.zip

  # =========================================================================
  # macOS Apple Silicon build
  # =========================================================================
  build-macos-arm64:
    executor: macos
    steps:
      - checkout_and_restore
      - install_macos_deps
      - restore_mgcb_tool
      - attach_workspace:
          at: .
      - run:
          name: Publish macOS arm64
          command: |
            dotnet publish NOBOIShooter.DesktopGL/NOBOIShooter.DesktopGL.csproj \
              -r osx-arm64 \
              --self-contained \
              -c Release \
              -p:BuildContent=false \
              -o artifacts/osx-arm64
      - run:
          name: Package macOS arm64 artifact
          command: |
            cd artifacts/osx-arm64
            zip -r ../NOBOIShooter-osx-arm64.zip .
      - save_dotnet_cache
      - store_artifacts:
          path: artifacts/NOBOIShooter-osx-arm64.zip
          destination: builds/NOBOIShooter-osx-arm64.zip

  # =========================================================================
  # Android build
  # =========================================================================
  build-android:
    executor: dotnet
    steps:
      - checkout_and_restore
      - install_linux_deps
      - install_android_sdk
      - run:
          name: Install Android workload
          command: dotnet workload install android
      - restore_mgcb_tool
      - attach_workspace:
          at: .
      - run:
          name: Publish Android arm64 (unsigned APK)
          command: |
            dotnet publish NOBOIShooter.Android/NOBOIShooter.Android.csproj \
              -r android-arm64 \
              --self-contained \
              -c Release \
              -o artifacts/android-arm64
      - run:
          name: Publish Android x64 (for emulator testing)
          command: |
            dotnet publish NOBOIShooter.Android/NOBOIShooter.Android.csproj \
              -r android-x64 \
              --self-contained \
              -c Release \
              -o artifacts/android-x64
      - run:
          name: Package Android artifacts
          command: |
            cd artifacts/android-arm64
            zip -r ../NOBOIShooter-android-arm64.zip .
            cd ../android-x64
            zip -r ../NOBOIShooter-android-x64.zip .
      - save_dotnet_cache
      - store_artifacts:
          path: artifacts/NOBOIShooter-android-arm64.zip
          destination: builds/NOBOIShooter-android-arm64.zip
      - store_artifacts:
          path: artifacts/NOBOIShooter-android-x64.zip
          destination: builds/NOBOIShooter-android-x64.zip

  # =========================================================================
  # iOS build (unsigned)
  # =========================================================================
  build-ios:
    executor: macos
    steps:
      - checkout_and_restore
      - install_macos_deps
      - run:
          name: Install iOS workload
          command: dotnet workload install ios
      - restore_mgcb_tool
      - attach_workspace:
          at: .
      - run:
          name: Publish iOS arm64 (unsigned)
          command: |
            dotnet publish NOBOIShooter.iOS/NOBOIShooter.iOS.csproj \
              -r ios-arm64 \
              --self-contained \
              -c Release \
              -p:EnableCodeSigning=false \
              -p:CodesignKey="" \
              -p:BuildContent=false \
              -o artifacts/ios-arm64
      - run:
          name: Package iOS artifact
          command: |
            cd artifacts/ios-arm64
            zip -r ../NOBOIShooter-ios-arm64.zip .
      - save_dotnet_cache
      - store_artifacts:
          path: artifacts/NOBOIShooter-ios-arm64.zip
          destination: builds/NOBOIShooter-ios-arm64.zip

# ---------------------------------------------------------------------------
# Workflows
# ---------------------------------------------------------------------------
workflows:
  version: 2
  build-and-release:
    jobs:
      - build-content
      - build-windows:
          requires:
            - build-content
      - build-linux:
          requires:
            - build-content
      - build-macos-x64:
          requires:
            - build-content
      - build-macos-arm64:
          requires:
            - build-content
      - build-android:
          requires:
            - build-content
      - build-ios:
          requires:
            - build-content
